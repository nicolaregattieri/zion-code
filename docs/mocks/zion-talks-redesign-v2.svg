<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0E0E12"/><stop offset="100%" stop-color="#0A0A0D"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7C5CFF"/><stop offset="100%" stop-color="#5B3FE0"/>
    </linearGradient>
    <linearGradient id="userTint" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7C5CFF" stop-opacity="0.12"/><stop offset="100%" stop-color="#7C5CFF" stop-opacity="0.06"/>
    </linearGradient>
  </defs>
  <rect width="1440" height="900" fill="url(#bg)"/>

  <!-- ===== TOP TOOLBAR (preserved, simplified) ===== -->
  <rect x="0" y="0" width="1440" height="40" fill="#0A0A0D"/>
  <rect x="0" y="39" width="1440" height="1" fill="#1F1F26"/>
  <text x="22" y="26" fill="#9999A5" font-size="12">Zion</text>
  <!-- system meters compact -->
  <text x="1100" y="26" fill="#6B6B78" font-size="11" font-family="SF Mono, monospace">CPU 8% · RAM 32% · 1.2k/200k tok · $0.034</text>
  <!-- right action icons (preserved) -->
  <g fill="#6B6B78" font-size="13">
    <text x="1300" y="26">⊞</text><text x="1322" y="26">↓</text><text x="1344" y="26">↑</text><text x="1366" y="26">⌖</text><text x="1388" y="26">⎌</text><text x="1410" y="26">?</text>
  </g>

  <!-- ===== LEFT RAIL (60px) — section nav (preserved compact) ===== -->
  <rect x="0" y="40" width="56" height="844" fill="#0C0C10"/>
  <rect x="55" y="40" width="1" height="844" fill="#1F1F26"/>
  <g fill="#6B6B78" font-size="14" text-anchor="middle">
    <text x="28" y="78">⎘</text>
    <text x="28" y="118">◐</text>
    <text x="28" y="158">⌥</text>
  </g>
  <rect x="14" y="190" width="28" height="28" rx="8" fill="#7C5CFF" fill-opacity="0.15"/>
  <text x="28" y="210" fill="#B8A4FF" font-size="14" text-anchor="middle">▤</text>
  <text x="28" y="864" fill="#3A3A45" font-size="12" text-anchor="middle">⚙</text>

  <!-- ===== CONVERSATION COLUMN (56 → 1140) ===== -->

  <!-- thread header row -->
  <g transform="translate(80, 60)">
    <text fill="#E8E8EF" font-size="15" font-weight="600">Memory pressure cleanup</text>
    <text y="20" fill="#6B6B78" font-size="11.5">12 messages · started 2h ago</text>

    <!-- right cluster: plan mode + auto-resolved chip + history toggle -->
    <g transform="translate(736, -2)">
      <!-- plan mode wand -->
      <text x="0" y="14" fill="#3A3A45" font-size="14">✦</text>
      <!-- auto resolved -->
      <g transform="translate(28, 0)">
        <rect width="170" height="22" rx="11" fill="#1A1A22" stroke="#2A2A33" stroke-width="0.5"/>
        <circle cx="12" cy="11" r="3" fill="#3FCF8E"/>
        <text x="22" y="15" fill="#B8B8C4" font-size="10.5" font-family="SF Mono, monospace">Auto → Qwen 14B · easy</text>
      </g>
      <!-- subscription pill (preserved) -->
      <g transform="translate(212, 0)">
        <rect width="86" height="22" rx="11" fill="none" stroke="#26262E" stroke-width="0.5"/>
        <circle cx="12" cy="11" r="3" fill="#3FCF8E"/>
        <text x="22" y="15" fill="#9999A5" font-size="10.5">Sub · 24</text>
      </g>
      <!-- sidebar toggle -->
      <text x="312" y="14" fill="#6B6B78" font-size="13">▭</text>
    </g>
  </g>

  <rect x="80" y="98" width="1036" height="1" fill="#1A1A22"/>

  <!-- ===== ASSISTANT MSG 1 — flowing, label only on burst start ===== -->
  <text x="80" y="134" fill="#6B6B78" font-size="10.5" letter-spacing="0.6" font-weight="600">ASSISTANT</text>
  <text x="80" y="162" fill="#E0E0E8" font-size="14.5">Inclui memória <tspan font-weight="600">comprimida</tspan> no total &quot;usado&quot;. Activity Monitor</text>
  <text x="80" y="182" fill="#E0E0E8" font-size="14.5">por padrão mostra só <tspan font-family="SF Mono, monospace" font-size="13" fill="#B8A4FF">active + wired</tspan>.</text>

  <!-- code block — accent bar + copy + apply -->
  <g transform="translate(80, 198)">
    <rect width="720" height="58" rx="6" fill="#13131A"/>
    <rect width="3" height="58" fill="#7C5CFF" fill-opacity="0.4"/>
    <text x="16" y="24" font-family="SF Mono, monospace" font-size="12.5">
      <tspan fill="#FF8A6E">let</tspan>
      <tspan fill="#E0E0E8"> used = active + wired</tspan>
      <tspan fill="#5B5B6B">  // sem compressed</tspan>
    </text>
    <text x="16" y="44" fill="#5B5B6B" font-family="SF Mono, monospace" font-size="11">swift · MemoryMonitor.swift:42</text>
    <!-- inline actions right -->
    <g transform="translate(620, 20)">
      <text x="0" y="0" fill="#6B6B78" font-size="11">⧉ Copy</text>
      <text x="58" y="0" fill="#B8A4FF" font-size="11">✓ Apply</text>
    </g>
  </g>

  <!-- ===== TOOL EVENT CHIPS — inline during streaming ===== -->
  <g transform="translate(80, 274)">
    <rect width="248" height="28" rx="14" fill="#13131A" stroke="#1F1F26"/>
    <circle cx="14" cy="14" r="3" fill="#3FCF8E"/>
    <text x="26" y="18" fill="#9999A5" font-size="11.5">read_file · MemoryMonitor.swift</text>
    <text x="226" y="18" fill="#5B5B6B" font-size="10">0.2s</text>
  </g>

  <!-- ===== USER MSG (right-aligned, content-width, subtle tint) ===== -->
  <g transform="translate(636, 322)">
    <rect width="480" height="36" rx="10" fill="url(#userTint)" stroke="#3A2A6B" stroke-width="0.5"/>
    <text x="20" y="23" fill="#E0E0E8" font-size="14">não sei o que me sugere mostrar?</text>
  </g>

  <!-- ===== ASSISTANT BURST — no avatar/label repeat ===== -->
  <text x="80" y="394" fill="#E0E0E8" font-size="14.5">Posso aplicar a remoção do <tspan font-family="SF Mono, monospace" font-size="13" fill="#B8A4FF">compressed</tspan> e revisar os call sites?</text>

  <!-- Apply All / Reject inline -->
  <g transform="translate(80, 412)">
    <rect width="98" height="26" rx="13" fill="#7C5CFF" fill-opacity="0.14" stroke="#7C5CFF" stroke-opacity="0.3" stroke-width="0.5"/>
    <text x="14" y="18" fill="#B8A4FF" font-size="11.5" font-weight="500">Apply all</text>
    <text x="80" y="18" fill="#7C5CFF" font-size="11">↵</text>
  </g>
  <g transform="translate(186, 412)">
    <rect width="78" height="26" rx="13" fill="none" stroke="#2A2A33" stroke-width="0.5"/>
    <text x="14" y="18" fill="#9999A5" font-size="11.5">Reject</text>
  </g>

  <!-- ===== USER MSG short ===== -->
  <g transform="translate(916, 462)">
    <rect width="200" height="36" rx="10" fill="url(#userTint)" stroke="#3A2A6B" stroke-width="0.5"/>
    <text x="20" y="23" fill="#E0E0E8" font-size="14">consigo adicionar MCP?</text>
  </g>

  <!-- ===== ASSISTANT w/ tool_use chip ===== -->
  <text x="80" y="540" fill="#E0E0E8" font-size="14.5">Sim — cola o JSON do server aqui, ou me dá o link:</text>
  <g transform="translate(80, 558)">
    <rect width="300" height="40" rx="6" fill="#13131A" stroke="#1F1F26"/>
    <circle cx="20" cy="20" r="7" fill="#7C5CFF" fill-opacity="0.18"/>
    <text x="20" y="24" fill="#B8A4FF" font-size="10" text-anchor="middle">⚙</text>
    <text x="38" y="18" fill="#E0E0E8" font-size="12" font-weight="500">install_mcp_server</text>
    <text x="38" y="32" fill="#6B6B78" font-size="10.5" font-family="SF Mono, monospace">waiting for JSON</text>
  </g>

  <!-- ===== TRANSIENT NOTICE (above composer) ===== -->
  <g transform="translate(80, 658)">
    <rect width="1036" height="28" rx="14" fill="#7C5CFF" fill-opacity="0.10" stroke="#7C5CFF" stroke-opacity="0.25"/>
    <circle cx="18" cy="14" r="3" fill="#7C5CFF"/>
    <text x="30" y="18" fill="#B8A4FF" font-size="11.5">MCP server context-mode launched · 11 tools available</text>
  </g>

  <!-- ===== PENDING ATTACHMENTS CHIP ROW ===== -->
  <g transform="translate(80, 698)">
    <rect width="180" height="26" rx="6" fill="#1A1A22" stroke="#26262E" stroke-width="0.5"/>
    <text x="12" y="17" fill="#9999A5" font-size="11.5">📎 screenshot.png · 240KB</text>
    <text x="160" y="17" fill="#5B5B6B" font-size="11">×</text>
  </g>

  <!-- ===== COMPOSER — docked hairline ===== -->
  <g transform="translate(80, 734)">
    <rect width="1036" height="96" rx="14" fill="#13131A" stroke="#26262E" stroke-width="0.5"/>
    <!-- placeholder -->
    <text x="20" y="32" fill="#5B5B6B" font-size="14">Ask, attach a file, paste an MCP config, or "/" for commands…</text>

    <!-- divider before action row -->
    <rect x="0" y="60" width="1036" height="0.5" fill="#1F1F26"/>

    <!-- action row -->
    <g transform="translate(14, 78)">
      <!-- left: triggers -->
      <text x="0" y="0" fill="#6B6B78" font-size="12" font-family="SF Mono">@</text>
      <text x="22" y="0" fill="#6B6B78" font-size="12" font-family="SF Mono">/</text>
      <text x="44" y="0" fill="#6B6B78" font-size="11">📎</text>
      <text x="68" y="0" fill="#6B6B78" font-size="11">🎤</text>
    </g>

    <!-- center: collapsed status pill (Mode · Permission · Bash) -->
    <g transform="translate(412, 70)">
      <rect width="212" height="22" rx="11" fill="none" stroke="#26262E" stroke-width="0.5"/>
      <text x="14" y="15" fill="#9999A5" font-size="10.5">Edit · Always ask · Shell off</text>
      <text x="194" y="15" fill="#6B6B78" font-size="9">⌃</text>
    </g>

    <!-- right: token meter (mirrored from top), queue badge, stop or send -->
    <g transform="translate(840, 70)">
      <text x="0" y="15" fill="#6B6B78" font-size="10.5" font-family="SF Mono, monospace">1.2k tok</text>
      <!-- queue badge -->
      <g transform="translate(64, 0)">
        <rect width="22" height="22" rx="11" fill="#FF8A6E" fill-opacity="0.18" stroke="#FF8A6E" stroke-opacity="0.3" stroke-width="0.5"/>
        <text x="11" y="15" fill="#FF8A6E" font-size="11" text-anchor="middle">2</text>
      </g>
    </g>
    <!-- single brand button: send (only purple element in composer) -->
    <circle cx="1006" cy="80" r="13" fill="url(#brand)"/>
    <text x="1006" y="85" fill="white" font-size="14" text-anchor="middle">↑</text>
  </g>

  <!-- ===== LOCAL MODEL STRIP — quiet, above composer when local engaged ===== -->
  <!-- (drawn slightly transparent here to indicate collapsible / conditional) -->
  <g transform="translate(80, 838)" opacity="0.55">
    <circle cx="6" cy="6" r="3" fill="#3FCF8E"/>
    <text x="16" y="9" fill="#6B6B78" font-size="10.5" font-family="SF Mono, monospace">mlx · Qwen2.5-Coder-14B-4bit · 25.8/48 GB · 152 MB · Disconnect</text>
  </g>

  <!-- ===== RIGHT PANE — threads ===== -->
  <rect x="1140" y="40" width="1" height="844" fill="#1A1A22"/>

  <text x="1166" y="74" fill="#6B6B78" font-size="10.5" letter-spacing="0.6" font-weight="600">THREADS</text>
  <g transform="translate(1262, 60)">
    <rect width="22" height="22" rx="6" fill="#1A1A22"/>
    <text x="11" y="16" fill="#9999A5" font-size="11" text-anchor="middle">＋</text>
  </g>

  <!-- active thread with streaming pulse -->
  <g transform="translate(1166, 100)">
    <rect x="-10" y="-8" width="270" height="44" rx="8" fill="#7C5CFF" fill-opacity="0.06"/>
    <circle cx="-22" cy="14" r="3" fill="#7C5CFF">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="1.4s" repeatCount="indefinite"/>
    </circle>
    <text x="0" y="6" fill="#E0E0E8" font-size="13" font-weight="500">Memory pressure cleanup</text>
    <text x="0" y="22" fill="#6B6B78" font-size="11">just now · streaming…</text>
  </g>

  <g transform="translate(1166, 164)">
    <text x="0" y="6" fill="#B8B8C4" font-size="13" font-weight="500">context tokens overflow</text>
    <text x="0" y="22" fill="#5B5B6B" font-size="11">22h ago · 5 msgs</text>
  </g>

  <g transform="translate(1166, 220)">
    <text x="0" y="6" fill="#B8B8C4" font-size="13" font-weight="500">tree scan investigation</text>
    <text x="0" y="22" fill="#5B5B6B" font-size="11">2d ago · 18 msgs</text>
  </g>

  <g transform="translate(1166, 276)">
    <text x="0" y="6" fill="#B8B8C4" font-size="13" font-weight="500">hello</text>
    <text x="0" y="22" fill="#5B5B6B" font-size="11">2d ago · 1 msg</text>
  </g>

  <!-- spend meter pill at bottom of right pane -->
  <g transform="translate(1166, 800)">
    <rect width="248" height="32" rx="8" fill="#13131A" stroke="#1F1F26" stroke-width="0.5"/>
    <text x="14" y="14" fill="#6B6B78" font-size="10" letter-spacing="0.4">MONTHLY SPEND</text>
    <text x="14" y="28" fill="#E0E0E8" font-size="12" font-family="SF Mono, monospace">$4.21 · 1.2M tokens</text>
  </g>
  <text x="1166" y="860" fill="#3A3A45" font-size="10">↑↓ navigate · ⌘N new</text>

  <!-- ===== BOTTOM TAB BAR (preserved, restyled minimal) ===== -->
  <rect x="0" y="884" width="1440" height="16" fill="#0C0C10"/>
  <rect x="0" y="884" width="1440" height="0.5" fill="#1A1A22"/>
  <g font-size="10" font-family="SF Mono, monospace">
    <text x="72" y="895" fill="#5B5B6B">Ops</text>
    <text x="110" y="895" fill="#B8A4FF">● Zion Talks</text>
    <text x="220" y="895" fill="#5B5B6B">Recents</text>
    <text x="280" y="895" fill="#5B5B6B">Settings</text>
    <text x="1100" y="895" fill="#5B5B6B">feat/chat-ui-redesign</text>
    <text x="1280" y="895" fill="#3A3A45">~/Developer/GraphForge</text>
  </g>
</svg>
